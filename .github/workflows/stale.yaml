name: Stale issue/PR management

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef8a2bf7a9b4bfde2c33edb371b8a14ecfcf87  # v9
        with:
          stale-issue-message: This issue has been automatically marked as stale because it has had no activity in 60 days. If no further activity occurs within 7 days, it will be closed.
          stale-pr-message: This pull request has been automatically marked as stale because it has had no activity in 90 days. If no further activity occurs within 14 days, it will be closed.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 90
          days-before-pr-close: 14
          exempt-issue-labels: pinned,security,bug,enhancement
          exempt-pr-labels: pinned,security,bug,enhancement
