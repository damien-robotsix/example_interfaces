name: CI

on:
  push:
    branches: [lyrical]
  pull_request:
    branches: [lyrical]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check DCO
        run: |
          git branch "${{ github.base_ref }}" "origin/${{ github.base_ref }}"
          BASE="${{ github.base_ref }}"
          FAIL=0
          for commit in $(git log --format='%H' "$BASE..HEAD"); do
            if ! git log -1 --format='%B' "$commit" | grep -q '^Signed-off-by:'; then
              echo "Commit $commit is missing Signed-off-by trailer"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "DCO check failed: some commits are missing Signed-off-by"
            exit 1
          fi
          echo "DCO check passed"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  trivy-scan:
    name: trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ github.workspace }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9  # v3
        with:
          sarif_file: trivy-results.sarif

  build-and-test:
    name: build-and-test
  humble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest
    steps:
      # (identical steps as current: checkout, ccache, action-ros-ci with
      #  target-ros2-distro: humble, upload-artifact, codecov, publish-test-results)

  jazzy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      # (identical to humble, but target-ros2-distro: jazzy)

  rolling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      # (identical to humble, but target-ros2-distro: rolling)
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [humble, jazzy, rolling]
        include:
          - ros_distribution: humble
            container_image: rostooling/setup-ros-docker:ubuntu-jammy-latest
          - ros_distribution: jazzy
            container_image: rostooling/setup-ros-docker:ubuntu-noble-latest
          - ros_distribution: rolling
            container_image: rostooling/setup-ros-docker:ubuntu-noble-latest
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # ── ccache setup ──────────────────────────────────────────────
      - name: Setup ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          ccache --max-size=2G
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "/usr/lib/ccache" >> $GITHUB_PATH
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.ros_distribution }}-${{ hashFiles('CMakeLists.txt', 'package.xml', 'msg/*.msg', 'srv/*.srv', 'action/*.action', 'test/*.cpp') }}
          restore-keys: ccache-${{ matrix.ros_distribution }}-
          save-always: true
      - name: Point lcov to .lcovrc config
        run: |
          # action-ros-ci places the checkout under <ws>/src/example_interfaces/
          # but lcov (via colcon coverage-gcc mixin) runs from the workspace root.
          # lcov searches for .lcovrc from CWD upward, so it won't find the
          # package's .lcovrc.  Export the LCOVRC env var so lcov picks it up.
          echo "LCOVRC=${{ github.workspace }}/.lcovrc" >> "$GITHUB_ENV"
      - uses: ros-tooling/action-ros-ci@3a640b10f09b756dabe556dac5413aba369f71b0  # v0.4
        id: action_ros_ci_step
        with:
          package-name: example_interfaces
          target-ros2-distro: ${{ matrix.ros_distribution }}
          colcon-defaults: |
            {
              "build": { "mixin": ["coverage-gcc"] }
            }
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros_distribution }}
          path: ${{ steps.action_ros_ci_step.outputs.ros-workspace-directory-name }}/log
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        if: always()
        with:
          files: ${{ steps.action_ros_ci_step.outputs.ros-workspace-directory-name }}/lcov/total_coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        with:
          files: |
            ${{ steps.action_ros_ci_step.outputs.ros-workspace-directory-name }}/build/*/test_results/**/*.xml
