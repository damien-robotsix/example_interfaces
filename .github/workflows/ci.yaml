name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: pre-commit/action@v3.0.1

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [humble, jazzy, rolling]
        include:
          - ros_distribution: humble
            container_image: rostooling/setup-ros-docker:ubuntu-jammy-latest
          - ros_distribution: jazzy
            container_image: rostooling/setup-ros-docker:ubuntu-noble-latest
          - ros_distribution: rolling
            container_image: rostooling/setup-ros-docker:ubuntu-noble-latest
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/action-ros-ci@v0.4
        id: action_ros_ci_step
        with:
          package-name: example_interfaces
          target-ros2-distro: ${{ matrix.ros_distribution }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros_distribution }}
          path: ${{ steps.action_ros_ci_step.outputs.ros-workspace-directory-name }}/log
