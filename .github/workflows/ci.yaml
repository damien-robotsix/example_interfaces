name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: pre-commit/action@v3.0.1

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/example_interfaces
      - name: Install dependencies with rosdep
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
          colcon mixin update default
          colcon build --packages-up-to example_interfaces --mixin coverage-gcc
      - name: Test
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test --packages-select example_interfaces
          colcon test-result --verbose
      - name: Generate coverage report
        shell: bash
        run: |
          apt-get update && apt-get install -y lcov
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,gcov,unused,empty
          lcov --remove coverage.info '/usr/*' '/opt/*' '*/test/*' --output-file coverage.info \
            --ignore-errors unused,empty
          lcov --list coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
