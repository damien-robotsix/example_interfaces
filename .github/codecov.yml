fixes:
  - "ros_ws/src/*/example_interfaces::"

coverage:
  precision: 2
  round: down
  range: "0...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
